# @format

apiVersion: apps/v1
kind: Deployment
metadata:
  name: euterpe
  labels:
    app: euterpe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: euterpe
  template:
    metadata:
      labels:
        app: euterpe
    spec:
      # Optional: pin this deployment to nodes labeled for specific workload pools.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: workload/audio-transcode
      #               operator: In
      #               values:
      #                 - "true"
      containers:
        - name: euterpe
          image: euterpe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: euterpe-secrets
            - configMapRef:
                name: euterpe-config
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: euterpe-data
