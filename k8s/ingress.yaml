# Ingress for external access. Sona (Cloudflare Workers) needs to reach Euterpe.
# Adapt: host, TLS secret, ingressClassName for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: euterpe
  labels:
    app: euterpe
  annotations:
    # nginx-ingress examples (remove or change for other controllers):
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"  # large audio uploads
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"  # long-running transcodes
spec:
  ingressClassName: nginx  # or: traefik, kong, your cluster default
  rules:
    - host: euterpe.example.com  # replace with your host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: euterpe
                port:
                  number: 80
  # Uncomment for TLS (create secret separately):
  # tls:
  #   - hosts:
  #       - euterpe.example.com
  #     secretName: euterpe-tls
